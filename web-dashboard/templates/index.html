<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Dashboard - Kelompok</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 30px; }
    h1 { text-align: center; font-size: 28px; color: #38bdf8; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #64748b; margin-bottom: 30px; font-size: 14px; }
    .status-bar { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
    .status-chip { padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; }
    .chip-on { background: #064e3b; color: #34d399; }
    .chip-off { background: #450a0a; color: #f87171; }
    .ldr-box { background: #1e293b; border-radius: 12px; padding: 16px 24px; text-align: center; margin-bottom: 30px; max-width: 400px; margin-left: auto; margin-right: auto; }
    .ldr-label { font-size: 13px; color: #64748b; margin-bottom: 6px; }
    .ldr-value { font-size: 36px; font-weight: 700; color: #fbbf24; }
    .ldr-bar { height: 8px; background: #0f172a; border-radius: 4px; margin-top: 10px; overflow: hidden; }
    .ldr-fill { height: 100%; background: linear-gradient(90deg, #1d4ed8, #fbbf24); border-radius: 4px; transition: width 0.5s; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 700px; margin: 0 auto; }
    .led-card { background: #1e293b; border-radius: 16px; padding: 24px; text-align: center; border: 2px solid #1e293b; transition: all 0.3s; }
    .led-card.active { border-color: #38bdf8; background: #0c2340; }
    .led-icon { font-size: 48px; margin-bottom: 12px; filter: grayscale(1); transition: filter 0.3s; }
    .led-card.active .led-icon { filter: grayscale(0); }
    .led-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .led-owner { font-size: 12px; color: #64748b; margin-bottom: 16px; }
    .btn { width: 100%; padding: 10px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-on { background: #0284c7; color: white; }
    .btn-on:hover { background: #0369a1; }
    .btn-off { background: #dc2626; color: white; }
    .btn-off:hover { background: #b91c1c; }
    .btn-all { display: block; margin: 20px auto 0; width: 100%; max-width: 700px; padding: 12px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-all-on { background: #16a34a; color: white; }
    .btn-all-off { background: #7c3aed; color: white; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>🔌 IoT LED Dashboard</h1>
  <p class="subtitle">Kelompok IoT — Arduino Uno R3</p>

  <div class="status-bar">
    <span class="status-chip" id="arduino-status">⚡ Mengecek Arduino...</span>
    <span class="status-chip chip-on" id="server-status">✅ Server Online</span>
  </div>

  <div class="ldr-box">
    <div class="ldr-label">Sensor Cahaya (LDR)</div>
    <div class="ldr-value" id="ldr-val">0</div>
    <div class="ldr-bar"><div class="ldr-fill" id="ldr-bar" style="width:0%"></div></div>
  </div>

  <div class="grid">
    <div class="led-card" id="card-LED1">
      <div class="led-icon">🔴</div>
      <div class="led-name">LED 1</div>
      <div class="led-owner">Rivaldo — Pin 8</div>
      <button class="btn btn-on" onclick="control('LED1','ON')">Nyalakan</button>
      <button class="btn btn-off" style="margin-top:8px" onclick="control('LED1','OFF')">Matikan</button>
    </div>
    <div class="led-card" id="card-LED2">
      <div class="led-icon">🟢</div>
      <div class="led-name">LED 2</div>
      <div class="led-owner">Bayu — Pin 9</div>
      <button class="btn btn-on" onclick="control('LED2','ON')">Nyalakan</button>
      <button class="btn btn-off" style="margin-top:8px" onclick="control('LED2','OFF')">Matikan</button>
    </div>
    <div class="led-card" id="card-LED3">
      <div class="led-icon">🟡</div>
      <div class="led-name">LED 3</div>
      <div class="led-owner">Afandi — Pin 10</div>
      <button class="btn btn-on" onclick="control('LED3','ON')">Nyalakan</button>
      <button class="btn btn-off" style="margin-top:8px" onclick="control('LED3','OFF')">Matikan</button>
    </div>
    <div class="led-card" id="card-LED4">
      <div class="led-icon">🔵</div>
      <div class="led-name">LED 4</div>
      <div class="led-owner">Ketua — Pin 11</div>
      <button class="btn btn-on" onclick="control('LED4','ON')">Nyalakan</button>
      <button class="btn btn-off" style="margin-top:8px" onclick="control('LED4','OFF')">Matikan</button>
    </div>
  </div>

  <button class="btn btn-all btn-all-on" onclick="controlAll('ON')">⚡ Nyalakan Semua LED</button>
  <button class="btn btn-all btn-all-off" onclick="controlAll('OFF')">🌑 Matikan Semua LED</button>

  <script>
    function control(led, state) {
      fetch('/control', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({cmd: led+':'+state, led: led, state: state==='ON'})
      }).then(() => updateStatus());
    }
